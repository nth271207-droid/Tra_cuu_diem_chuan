name: Triển khai lên GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

# Quyền hạn cấp cho GITHUB_TOKEN để tự động triển khai lên GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Chỉ cho phép 1 lần triển khai tại một thời điểm
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Tải mã nguồn (Checkout)
        uses: actions/checkout@v4

      - name: Cấu hình GitHub Pages
        uses: actions/configure-pages@v5

      - name: Nén và tải lên Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Triển khai toàn bộ thư mục gốc (chứa index.html, web/, data/)
          path: '.'

      - name: Triển khai lên GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
